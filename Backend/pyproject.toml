[project]
name = "aipoweredwebscraperbackendpractice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "docker>=7.2.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "langchain-openrouter>=0.2.8",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "rabbitmq>=0.2.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
aipoweredwebscraperbackendpractice = "aipoweredwebscraperbackendpractice:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
